name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip if needed
        run: |
          ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z" -d . && rm "$z" || true; done
          if [ -d "jf-clon (1)" ]; then cp -r "jf-clon (1)"/* .; rm -rf "jf-clon (1)"; fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix gradle and build
        run: |
          python3 << 'PY'
          import pathlib, re
          f=pathlib.Path("app/build.gradle.kts")
          if f.exists():
            t=f.read_text()
            t=re.sub(r".*google.*services.*\n","",t)
            t=re.sub(r".*firebase.*\n","",t,flags=re.I)
            t=re.sub(r".*secrets.*\n","",t,flags=re.I)
            t=re.sub(r"alias\(libs\.plugins\.firebase[^)]+\)","",t)
            t=re.sub(r"ksp\(libs\.firebase[^)]+\)","",t)
            f.write_text(t)
          PY
          chmod +x ./gradlew
          yes | sdkmanager --licenses || true
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JF-Clon-APK
          path: app/build/outputs/apk/debug/*.apk
