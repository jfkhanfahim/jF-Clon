name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flatten project
        run: |
          ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z" -d . && rm -f "$z" || true; done
          [ -d "jf-clon (1)" ] && mv "jf-clon (1)"/* . -f && rm -rf "jf-clon (1)" || true
          find . -maxdepth 4 -name "gradlew" | head -1 | xargs -I {} sh -c 'DIR=$(dirname {}); if [ "$DIR" != "." ]; then mv $DIR/* .; fi' || true
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
