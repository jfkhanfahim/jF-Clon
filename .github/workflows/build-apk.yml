name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip project if uploaded as archive
        run: |
          ls -la
          # কোনো জিপ ফাইল থাকলে তা এক্সট্র্যাক্ট করবে
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting archive: $z"
              unzip -o "$z" -d .
              rm -f "$z"
            fi
          done

          # ফোল্ডার 'jf-clon (1)' বা নেস্টেড ডিরেক্টরি থাকলে ফাইলগুলো রুটে সরিয়ে আনবে
          if [ -d "jf-clon (1)" ]; then
            echo "Found nested folder 'jf-clon (1)', moving contents to root..."
            shopt -s dotglob
            cp -r "jf-clon (1)"/* .
            rm -rf "jf-clon (1)"
            shopt -u dotglob
          fi

          for d in */; do
            if [ -f "${d}settings.gradle.kts" ] && [ "$d" != "./" ] && [ "$d" != "app/" ]; then
              echo "Found project files inside $d, moving to root..."
              shopt -s dotglob
              cp -r "$d"* .
              rm -rf "$d"
              shopt -u dotglob
              break
            fi
          done
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix environment and build configuration
        run: |
          # ১. বেস৬৪ থেকে debug.keystore রিস্টোর করা অথবা নতুন কি-স্টোর তৈরি করা
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

          # ২. .env বা .env.example নিশ্চিত করা যাতে Secrets প্লাগিন এরর না দেয়
          if [ ! -f ".env.example" ]; then
            touch .env.example
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # ৩. google-services.json না থাকলে বিল্ড যেন আটকে না যায় তার নিরাপদ হ্যান্ডলিং
          python3 << 'PY'
          import pathlib
          f = pathlib.Path("app/build.gradle.kts")
          if f.exists():
              t = f.read_text()
              if not pathlib.Path("app/google-services.json").exists():
                  if "missingGoogleServicesStrategy" not in t:
                      t += "\ngoogleServices { missingGoogleServicesStrategy = com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy.WARN }\n"
              f.write_text(t)
          PY

          # ৪. gradlew তৈরি এবং এক্সিকিউটেবল পারমিশন দেওয়া
          if [ ! -f "./gradlew" ]; then
            gradle wrapper || true
          fi
          chmod +x ./gradlew

          # ৫. SDK লাইসেন্স গ্রহণ করা
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JF-Clon-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
