name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip and Flatten Project
        run: |
          ls -la
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z" -d . && rm -f "$z" || true
          done
          
          if [ -d "jf-clon (1)" ]; then
            echo "Moving files from jf-clon (1)"
            shopt -s dotglob nullglob
            mv "jf-clon (1)"/* . || true
            rm -rf "jf-clon (1)"
            shopt -u dotglob nullglob
          fi
          
          # যদি অন্য কোনো ফোল্ডারের ভেতর gradlew থাকে
          if [ ! -f "./gradlew" ]; then
            FOUND=$(find . -maxdepth 3 -name "gradlew" -type f | head -1)
            if [ -n "$FOUND" ]; then
              DIR=$(dirname "$FOUND")
              echo "Found gradlew in $DIR, moving up"
              shopt -s dotglob
              mv "$DIR"/* . || true
              shopt -u dotglob
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix environment
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          [ -f ".env.example" ] || touch .env.example
          [ -f ".env" ] || cp .env.example .env || touch .env
          
          # Firebase না থাকলে যেন ফেইল না করে
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"000","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:000:android:000","package_name":"com.example"}}]}' > app/google-services.json || true
          fi
          
          chmod +x ./gradlew || gradle wrapper
          chmod +x ./gradlew
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JF-Clon-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
